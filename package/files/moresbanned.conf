# morsebandd.conf — configuration for multi-band timing daemon

# Number of parallel Morse-like timing bands
bands=8

# Base microsecond duration for smallest pulse
base_us=50.0

# Slope expansion factor for timing curve
slope_us=200.0

# Slope mode:
# 0 = linear
# 1 = logarithmic
# 2 = exponential
# 3 = sigmoid
mode=0

# Predictor smoothing factor (0.0–1.0)
predictor_alpha=0.2

# Zero-circle prepacking weights
prepack_alpha=0.7
prepack_beta=0.3

# Prepack threshold (0.0–1.0)
prepack_threshold=0.4

# Frequency window for local binary scoring
freq_window=1000.0
